[technology-description]
arboriculture=Foundational research for restoring squirrel habitat through nut saplings and grove recovery.
wildlife-diversion=Introduces feeder infrastructure as a nonviolent diversion tool.
forest-surveying=Turns forest health, unrest, trust, and habitat pressure into observable values.
wildlife-relocation=Reserves the nonlethal relocation path for late-v1 runtime work.
ecological-stabilization=Reserves late-game ecology tuning for stable sanctuary regions.

[custom-input-name]
squirrel-madness-open-region-survey=Survey local forest region
squirrel-madness-relocate-selected-squirrel=Relocate selected squirrel

