[entity-description]
squirrel=A neutral forest squirrel. In damaged habitat it may harass nearby logistics and stash stolen loot in the trees.
nut-tree=A mature nut-bearing tree. Harvest it for nuts or preserve it to improve habitat.
nut-tree-harvested=A picked-clean nut tree. Leave it standing and it will recover over time.
nut-sapling=A slow-growing planted sapling. Protect it until it matures into a nut tree.
squirrel-feeder=Stock this feeder with nuts to calm nearby squirrel regions.
steel-squirrel-feeder=An upgraded squirrel feeder with double the storage capacity of the wooden version.
forest-survey-station=Use this station to inspect exact local forest metrics and visualize the connected forest cluster it is reading.
forest-stash=A squirrel-made stash. It should only appear through runtime events.

[technology-name]
arboriculture=Arboriculture
wildlife-diversion=Wildlife Diversion
forest-surveying=Forest Surveying
wildlife-relocation=Wildlife Relocation
ecological-stabilization=Ecological Stabilization

[technology-description]
arboriculture=Foundational research for restoring squirrel habitat through nut saplings and grove recovery.
wildlife-diversion=Introduces feeder infrastructure as a nonviolent diversion tool.
forest-surveying=Turns forest health, unrest, trust, and habitat pressure into observable values.
wildlife-relocation=Allows selected squirrels to be relocated into healthier nearby forest instead of being killed.
ecological-stabilization=Upgrades wildlife mitigation with larger feeders and later ecology tuning for stable sanctuary regions.

