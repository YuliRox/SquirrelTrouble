[entity-description]
nut-tree=A mature nut-bearing tree. Harvest it for nuts or preserve it to improve habitat.
nut-sapling=A slow-growing planted sapling. Protect it until it matures into a nut tree.
squirrel-feeder=Stock this feeder with nuts to calm nearby squirrel regions.
forest-survey-station=Use this station to inspect exact local forest metrics.
forest-stash=A squirrel-made stash. It should only appear through runtime events.

[technology-name]
arboriculture=Arboriculture
wildlife-diversion=Wildlife Diversion
