squirrel-madness-region-report=Region __1__, __2__: health __3__ (__4__), unrest __5__ (__6__), trust __7__ (__8__), pressure __9__ (__10__).
squirrel-madness-region-factors=Observed state: trees __1__, nut trees __2__, stocked feeders __3__/__4__, recent tree loss __5__, rolling pollution __6__.
squirrel-madness-region-forces=Scoring inputs: canopy __1__, nut bonus __2__, feeder bonus __3__, empty-feeder penalty __4__, deforestation penalty __5__, pollution penalty __6__.
squirrel-madness-feeder-placed=Placed a squirrel feeder. Stock it with at least 20 nuts to reduce local unrest.
squirrel-madness-survey-station-placed=Placed a Forest Survey Station. Select it or press ALT+S nearby to inspect the region.
squirrel-madness-sapling-planted=Planted a nut sapling. It will take time to mature into a full nut tree.
squirrel-madness-deforestation-hint=Heavy local tree loss raises squirrel unrest. Research Arboriculture to replant nut groves, then prepare Squirrel Feeders.
squirrel-madness-arboriculture-hint=Arboriculture researched. Harvest wild nut trees for nuts, craft Nut Saplings, and replant damaged forest edges.
squirrel-madness-wildlife-diversion-hint=Wildlife Diversion researched. Stock Squirrel Feeders with nuts to raise trust and pull squirrels away from theft targets.
